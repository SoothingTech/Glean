server:
  port: 8080

spring:
  application:
    name: glean-server

  datasource:
    url: jdbc:postgresql://localhost:5432/glean
    username: glean
    password: glean_dev_pwd

  jpa:
    hibernate:
      # 建表交给 Flyway，Hibernate 只做校验
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health,info

glean:
  auth:
    # 生产环境必须换成随机密钥并通过环境变量注入，长度至少 32 字节
    jwt-secret: "glean-dev-only-secret-key-please-replace-in-prod-0123456789"
    access-ttl: 30m
    refresh-ttl: 7d
    sms-code-ttl: 5m
    # 开发环境固定验证码，真实短信需企业资质
    dev-fixed-code: "123456"
